services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Connection string name matches Aspire convention so the same codebase
      # works under both Aspire (AppHost injects it) and plain docker-compose
      ConnectionStrings__orchestrator: "Host=db;Database=orchestrator;Username=orchestrator;Password=${DATABASE_PASSWORD}"
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
